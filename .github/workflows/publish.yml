# Publish n8n-nodes-whapi to npm with provenance (required for n8n Creator Portal verification).
#
# One-time setup (pick one):
# A) npm → package Settings → Trusted Publishers → GitHub Actions
#    owner: Whapi-Cloud, repo: n8n-nodes-whapi, workflow filename: publish.yml
#    Do NOT set NPM_TOKEN in GitHub (OIDC is used).
# B) Create NPM_TOKEN secret in GitHub (granular token, publish write for this package).
#
# Release: bump version in package.json, push main, then: git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build
        run: pnpm build

      - name: Publish with provenance
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
