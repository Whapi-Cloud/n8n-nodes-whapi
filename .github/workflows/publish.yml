# Publish n8n-nodes-whapi to npm with provenance (n8n Creator Portal requirement).
#
# npm Trusted Publisher (recommended):
#   Package Settings → Trusted publishing → GitHub Actions
#   Whapi-Cloud / n8n-nodes-whapi / workflow file: publish.yml
#   Enable "Allow npm publish" (not only "npm stage publish").
#
# Do NOT set NPM_TOKEN unless you use token fallback instead of OIDC.
#
# Release: bump version → push main → git tag -a vX.Y.Z && git push origin vX.Y.Z

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # No registry-url here — it injects NODE_AUTH_TOKEN (often GITHUB_TOKEN) and breaks npm OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure npm supports trusted publishing (OIDC)
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build
        run: pnpm build

      - name: Publish with provenance
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          else
            npm config delete //registry.npmjs.org/:_authToken || true
          fi
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
